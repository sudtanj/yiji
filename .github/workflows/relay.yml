name: relay

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches-ignore: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"

defaults:
  run:
    working-directory: relay

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build-aarch64:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: yiji-relay-aarch64-unknown-linux-gnu
          path: relay/target/aarch64-unknown-linux-gnu/release/yiji-relay

  bench:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - name: Relay throughput and latency
        shell: bash
        run: cargo test --release --test relay bench -- --ignored --nocapture | tee bench.txt
      - name: Summary
        run: |
          echo '### relay bench' >> "$GITHUB_STEP_SUMMARY"
          grep '^bench' bench.txt | sed 's/^bench: /- /' >> "$GITHUB_STEP_SUMMARY"
