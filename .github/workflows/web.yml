name: web

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches-ignore: [main]
    paths: ['web/**', 'wasm/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'wasm/**', '.github/workflows/web.yml']

defaults:
  run:
    working-directory: web

jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build yiji-wasm
        working-directory: wasm
        run: wasm-pack build --target web
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
          retention-days: 1

  build:
    needs: pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  smoke:
    needs: [pkg, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The runner image already has the Chromium libraries; --with-deps only adds fonts from flaky apt mirrors.
      - run: npx playwright install chromium
      - name: Smoke test the built app
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  bench:
    needs: pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Vault and grid benchmarks
        shell: bash
        run: YIJI_BENCH=1 npx vitest run src/vault.bench.test.ts | tee bench.txt
      - name: Summary
        run: |
          echo '### web bench' >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; grep -a 'BENCH' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
