[package]
name = "yiji-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PostgreSQL and MongoDB drivers for the Yiji browser client"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
futures = "0.3"
getrandom = "0.4"
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
# preserve_order keeps the command name first in the document, which MongoDB requires.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = "1"
# "js" turns on getrandom's wasm_js backend; default features pull in tokio/net and tokio/time.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["js"] }
tokio-util = { version = "0.7", features = ["compat"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
pharos = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
ws_stream_wasm = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt"] }

[profile.release]
opt-level = "s"
